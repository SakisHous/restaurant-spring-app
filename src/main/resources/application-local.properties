# H2 Database Configuration for Local Development
spring.datasource.url=jdbc:h2:mem:restaurant_db;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Enable H2 Web Console so you can view the DB in your browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate updates
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Your shared web settings
spring.web.locale=el_GR
spring.web.locale-resolver=fixed